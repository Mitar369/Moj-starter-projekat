name: Pokreni Developer Bota

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Dozvoljava ručno pokretanje

jobs:
  build-i-test:
    runs-on: ubuntu-latest

    steps:
    - name: Preuzmi kod repozitorijuma
      uses: actions/checkout@v3

    - name: Podesi Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Instaliraj zavisnosti
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Pokreni glavnu skriptu
      run: |
        python main.py
